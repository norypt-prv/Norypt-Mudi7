name: Build (Script)

# Fast path: assembles the IPK with build-ipk.sh, which cross-compiles the
# norypt-ghost-touch daemon from src/ with a plain aarch64 toolchain. The
# companion sdk-build.yml workflow builds the same package against the real
# OpenWrt SDK; releases carry both IPKs.
#
# No paths-ignore filters: their interaction with tag pushes is unreliable
# and a skipped build on a release tag would publish nothing. The build takes
# seconds, so README-only pushes rebuilding is an acceptable cost.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # jsonfilter is an OpenWrt utility and is not packaged for Ubuntu. The
      # host suite does not need it: the shell functions that call it run only
      # on the device, and are covered by docs/ACCEPTANCE.md.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.1 lua-bitop python3
      # --release enforces the TAC gate: every profiles.json TAC must be
      # verified:true. All catalog TACs are verified against Swappa device
      # records, so this now passes and keeps any future unverified TAC out.
      - run: ./tests/run.sh --release

  build:
    name: Build IPK
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # The release version lives in build-ipk.sh and the Makefile, not in
      # the tag — refuse to release when they disagree.
      - name: Verify tag matches PKG_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SH_VER="$(sed -n 's/^PKG_VERSION=//p' build-ipk.sh)"
          MK_VER="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          if [ "$SH_VER" != "$TAG" ] || [ "$MK_VER" != "$TAG" ]; then
            echo "::error::Tag v${TAG} does not match PKG_VERSION (build-ipk.sh=${SH_VER}, Makefile=${MK_VER}). Bump both, commit, then re-tag."
            exit 1
          fi

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build IPK
        env:
          BUILD_METHOD: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'CI' }}
        run: ./build-ipk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: norypt-ghost-${{ github.ref_name }}-${{ github.sha }}
          path: "*.ipk"
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: "*.ipk"
          generate_release_notes: true
          fail_on_unmatched_files: true
